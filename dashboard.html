<!DOCTYPE html>
<html>
<head>
    <title>Volunteer Dashboard</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #f2f6ff;
            text-align: center;
        }

        .header {
            background-color: #2563eb;
            color: white;
            padding: 25px;
        }

        .card {
            background-color: white;
            width: 330px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 10px;
        }

        button {
            padding: 10px 20px;
            margin: 8px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>Volunteer Dashboard</h1>
    <p>Welcome, Volunteer!</p>
</div>

<div class="card">
    <h2>Total Volunteer Hours</h2>
    <h1>25 Hours</h1>
</div>

<div class="card">
    <h2>My Activities</h2>
    <p>🌳 Tree Plantation - 5 Hours</p>
    <p>🤝 Community Service - 10 Hours</p>
    <p>🍱 Food Donation - 10 Hours</p>
</div>

<div class="card">
    <h2>Verification Status</h2>
    <p>✅ 3 Activities Verified</p>
    <p>⏳ 1 Activity Pending</p>
</div>

<button onclick="location.href='submit.html'">
    Submit Hours
</button>

<button onclick="location.href='leaderboard.html'">
    🏆 View Leaderboard
</button>

</body>
</html>
